openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: arena
    description: Hand Cricket Arena live service information
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /arena/status:
    get:
      operationId: getArenaStatus
      tags: [arena]
      summary: Get live arena status
      description: Returns current in-memory room and connected player counts.
      responses:
        "200":
          description: Arena status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ArenaStatus:
      type: object
      properties:
        activeRooms:
          type: integer
        connectedPlayers:
          type: integer
        maxPlayersPerRoom:
          type: integer
        maxPlayersPerTeam:
          type: integer
        modes:
          type: array
          items:
            type: string
            enum: [normal, baseball]
      required:
        - activeRooms
        - connectedPlayers
        - maxPlayersPerRoom
        - maxPlayersPerTeam
        - modes

